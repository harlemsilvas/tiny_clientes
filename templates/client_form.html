<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main class="form-shell">
      <section class="form-topbar">
        <div>
          <p class="crumbs"><a href="{{ url_for('index') }}">Clientes e Fornecedores</a></p>
          <h1>{{ page_title }}</h1>
        </div>
        <div class="header-actions">
          {% if not is_new %}
          <a class="ghost-link" href="{{ url_for('view_client', client_id=client.id) }}">Visualizar</a>
          {% endif %}
          <a class="ghost-link" href="{{ url_for('index') }}">Cancelar</a>
        </div>
      </section>

      <form method="post" class="form-card">
        <section class="form-section">
          <div class="section-heading">
            <h2>Dados cadastrais</h2>
            <p>Campos principais do registro</p>
          </div>
          <div class="form-grid three">
            <label><span>Nome *</span><input type="text" name="name" value="{{ client.name or '' }}" required></label>
            <label><span>Fantasia</span><input type="text" name="fantasy_name" value="{{ client.fantasy_name or '' }}"></label>
            <label><span>Codigo</span><input type="text" name="code" value="{{ client.code or '' }}"></label>
            <label><span>Tipo da pessoa</span><input type="text" name="person_type" value="{{ client.person_type or '' }}"></label>
            <label><span>CPF/CNPJ</span><input type="text" name="document" value="{{ client.document or '' }}"></label>
            <label><span>Status</span><input type="text" name="status" value="{{ client.status or '' }}"></label>
            <label><span>IE/RG</span><input type="text" name="state_registration" value="{{ client.state_registration or '' }}"></label>
            <label><span>IE isento</span><input type="text" name="state_registration_exempt" value="{{ client.state_registration_exempt or '' }}"></label>
            <label><span>Contribuinte</span><input type="text" name="taxpayer" value="{{ client.taxpayer or '' }}"></label>
            <label><span>Regime tributario</span><input type="text" name="tax_regime_code" value="{{ client.tax_regime_code or '' }}"></label>
            <label><span>Segmento</span><input type="text" name="segment" value="{{ client.segment or '' }}"></label>
            <label><span>Vendedor</span><input type="text" name="salesperson" value="{{ client.salesperson or '' }}"></label>
          </div>
        </section>

        <section class="form-section">
          <div class="section-heading">
            <h2>Endereco</h2>
            <p>Bloco principal e dados complementares</p>
          </div>
          <div class="tab-strip">
            <span class="tab active">Geral</span>
            <span class="tab">Cobranca</span>
          </div>
          <div class="form-grid four">
            <label><span>CEP</span><input type="text" name="zip_code" value="{{ client.zip_code or '' }}"></label>
            <label><span>UF</span><input type="text" name="state" value="{{ client.state or '' }}"></label>
            <label><span>Cidade</span><input type="text" name="city" value="{{ client.city or '' }}"></label>
            <label><span>Bairro</span><input type="text" name="district" value="{{ client.district or '' }}"></label>
          </div>
          <div class="form-grid three">
            <label class="wide"><span>Endereco</span><input type="text" name="address" value="{{ client.address or '' }}"></label>
            <label><span>Numero</span><input type="text" name="number" value="{{ client.number or '' }}"></label>
            <label><span>Complemento</span><input type="text" name="complement" value="{{ client.complement or '' }}"></label>
          </div>
        </section>

        <section class="form-section">
          <div class="section-heading">
            <h2>Contato</h2>
            <p>Dados para atendimento e faturamento</p>
          </div>
          <div class="form-grid four">
            <label><span>Fone</span><input type="text" name="phone" value="{{ client.phone or '' }}"></label>
            <label><span>Fax</span><input type="text" name="fax" value="{{ client.fax or '' }}"></label>
            <label><span>Celular</span><input type="text" name="mobile" value="{{ client.mobile or '' }}"></label>
            <label><span>Email</span><input type="email" name="email" value="{{ client.email or '' }}"></label>
            <label><span>Email para NFe</span><input type="email" name="invoice_email" value="{{ client.invoice_email or '' }}"></label>
            <label><span>WebSite</span><input type="text" name="website" value="{{ client.website or '' }}"></label>
            <label><span>Tipos de contato</span><input type="text" name="contact_types" value="{{ client.contact_types or '' }}"></label>
            <label><span>Observacoes do contato</span><input type="text" name="contact_notes" value="{{ client.contact_notes or '' }}"></label>
          </div>
          <div class="form-grid three">
            <label><span>Data nascimento</span><input type="text" name="birth_date" value="{{ client.birth_date or '' }}"></label>
            <label><span>Naturalidade</span><input type="text" name="birthplace" value="{{ client.birthplace or '' }}"></label>
            <label><span>Estado civil</span><input type="text" name="marital_status" value="{{ client.marital_status or '' }}"></label>
            <label><span>Profissao</span><input type="text" name="profession" value="{{ client.profession or '' }}"></label>
            <label><span>Sexo</span><input type="text" name="sex" value="{{ client.sex or '' }}"></label>
            <label><span>ID original</span><input type="text" name="source_id" value="{{ client.source_id or '' }}"></label>
          </div>
          <div class="form-grid two">
            <label><span>Nome do pai</span><input type="text" name="father_name" value="{{ client.father_name or '' }}"></label>
            <label><span>CPF do pai</span><input type="text" name="father_cpf" value="{{ client.father_cpf or '' }}"></label>
            <label><span>Nome da mae</span><input type="text" name="mother_name" value="{{ client.mother_name or '' }}"></label>
            <label><span>CPF da mae</span><input type="text" name="mother_cpf" value="{{ client.mother_cpf or '' }}"></label>
          </div>
          <label class="textarea-label">
            <span>Observacoes gerais</span>
            <textarea name="notes" rows="5">{{ client.notes or '' }}</textarea>
          </label>
        </section>

        <div class="form-footer">
          <a class="ghost-link" href="{{ url_for('index') }}">Cancelar</a>
          <button type="submit">{{ submit_label }}</button>
        </div>
      </form>
    </main>
  </body>
</html>
